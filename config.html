<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Voter Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>VoterTracker</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-link">
                <span class="nav-icon">📊</span> Dashboard
            </a>
            <a href="config.html" class="nav-link active">
                <span class="nav-icon">⚙️</span> Settings
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <h1>Settings</h1>
            <p>Configure your campaign details</p>
        </div>

        <!-- Candidate Name -->
        <div class="config-card">
            <h3>Your Name (Candidate)</h3>
            <p class="config-desc">This name will be used across the application</p>
            <div class="config-form">
                <input type="text" id="candidate-name" class="form-input" placeholder="Enter your name">
                <button class="btn btn-primary" id="save-name-btn">Save</button>
            </div>
        </div>

        <!-- Opposition Candidates -->
        <div class="config-card">
            <h3>Opposition Candidates</h3>
            <p class="config-desc">Add the names of opposition candidates for tracking</p>
            <div class="opposition-list" id="opposition-list">
                <!-- Populated by JS -->
            </div>
            <div class="config-form" style="margin-top: 12px;">
                <input type="text" id="new-opposition" class="form-input" placeholder="Add opposition candidate name">
                <button class="btn btn-primary" id="add-opposition-btn">Add</button>
            </div>
        </div>

        <!-- Data Management -->
        <div class="config-card">
            <h3>Data Management</h3>
            <p class="config-desc">Export or import your tracking data</p>
            <div class="config-form" style="gap: 12px;">
                <button class="btn btn-secondary" id="export-btn">Export Tracking Data</button>
                <button class="btn btn-secondary" id="import-btn">Import Tracking Data</button>
                <input type="file" id="import-file" accept=".json" style="display: none;">
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
</body>
</html>
