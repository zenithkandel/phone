<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voter Tracker - Voters List</title>
    <!-- CSS Style File -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- User Premium FontAwesome Kit CDN -->
    <script
      src="https://zenithkandel.com.np/fontawesome/zenith-icons.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar Navigation (Desktop) -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo-container">
            <i class="fa-sharp-duotone fa-solid fa-check-to-slot"></i>
          </div>
          <div>
            <h2>VoterTracker</h2>
            <span>Campaign Portal</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a
            href="index.html"
            class="nav-link active"
            id="sidebar-nav-dashboard"
          >
            <i class="fa-sharp-duotone fa-solid fa-address-book"></i> Voter List
          </a>
          <a href="stats.html" class="nav-link" id="sidebar-nav-stats">
            <i class="fa-sharp-duotone fa-solid fa-chart-line"></i> Campaign
            Stats
          </a>
          <a href="config.html" class="nav-link" id="sidebar-nav-settings">
            <i class="fa-sharp-duotone fa-solid fa-gear"></i> Settings
          </a>
        </nav>
      </aside>

      <!-- Main Workspace -->
      <main class="main-content">
        <!-- Top Dashboard Bar -->
        <div class="top-bar">
          <div class="page-header">
            <h1>Voter List</h1>
            <p>Search, filter, and track status for all registered voters</p>
          </div>

          <div class="user-profile" id="user-profile-widget">
            <div class="user-avatar" id="user-avatar-initials">VT</div>
            <div class="user-info">
              <span class="user-name" id="display-candidate-name"
                >Candidate</span
              >
              <span class="user-role">Election Candidate</span>
            </div>
          </div>
        </div>

        <!-- Filter Controls Panel -->
        <div class="filter-bar">
          <div class="search-container">
            <div class="search-icon-wrapper">
              <i class="fa-sharp-duotone fa-solid fa-magnifying-glass"></i>
            </div>
            <input
              type="text"
              class="search-input"
              id="search-input"
              placeholder="Search voters by name or phone..."
            />
          </div>

          <div class="filter-group">
            <!-- Toggle Show voters with no phone number (hides them by default) -->
            <label
              class="phone-toggle-container"
              id="toggle-no-phone-container"
              title="Hide or show voters with no phone numbers"
            >
              <input
                type="checkbox"
                id="toggle-show-no-phone"
                class="phone-toggle-input"
              />
              <div class="phone-toggle-switch"></div>
              <span>Show No Phone</span>
            </label>

            <div class="filter-select-wrapper">
              <select class="filter-select" id="filter-status">
                <option value="all">All Status</option>
                <option value="called">Called Only</option>
                <option value="not-called">Not Called</option>
                <option value="vote-me">Supporting Me</option>
                <option value="vote-opposition">Opposition Only</option>
              </select>
            </div>

            <div class="filter-select-wrapper">
              <select class="filter-select" id="filter-title">
                <option value="all">All Titles</option>
              </select>
            </div>

            <div class="filter-select-wrapper">
              <select class="filter-select" id="filter-source">
                <option value="all">All Sources</option>
                <option value="Final Voter List">Final Voter List</option>
                <option value="Life Member">Life Member</option>
              </select>
            </div>

            <div class="filter-select-wrapper">
              <select class="filter-select" id="filter-renewal">
                <option value="all">All Types</option>
                <option value="existing">Existing</option>
                <option value="new">New</option>
                <option value="life_member">Life Member</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Voter Cards Responsive Grid -->
        <div class="voter-grid" id="voter-cards-grid">
          <!-- Rendered dynamically by app.js -->
        </div>

        <!-- Pagination Bar -->
        <div class="pagination" id="pagination">
          <!-- Rendered dynamically by app.js -->
        </div>
      </main>

      <!-- Bottom Navigation Bar (Mobile View) -->
      <nav class="mobile-nav" id="mobile-navigation-bar">
        <a
          href="index.html"
          class="mobile-nav-link active"
          id="mobile-nav-dashboard"
        >
          <i class="fa-sharp-duotone fa-solid fa-address-book"></i>
          <span>Voters</span>
        </a>
        <a href="stats.html" class="mobile-nav-link" id="mobile-nav-stats">
          <i class="fa-sharp-duotone fa-solid fa-chart-line"></i>
          <span>Stats</span>
        </a>
        <a href="config.html" class="mobile-nav-link" id="mobile-nav-settings">
          <i class="fa-sharp-duotone fa-solid fa-gear"></i>
          <span>Settings</span>
        </a>
      </nav>
    </div>

    <!-- JS Logic File -->
    <script src="js/app.js"></script>
  </body>
</html>
