<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voter Tracker - My Lists</title>
    <link rel="stylesheet" href="css/style.css" />
    <script
      src="https://zenithkandel.com.np/fontawesome/zenith-icons.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar Navigation (Desktop) -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo-container">
            <i class="fa-sharp-duotone fa-solid fa-check-to-slot"></i>
          </div>
          <div>
            <h2>VoterTracker</h2>
            <span>Campaign Portal</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-link" id="sidebar-nav-dashboard">
            <i class="fa-sharp-duotone fa-solid fa-address-book"></i> Voter List
          </a>
          <a href="lists.html" class="nav-link active" id="sidebar-nav-lists">
            <i class="fa-sharp-duotone fa-solid fa-list-check"></i> My Lists
          </a>
          <a href="stats.html" class="nav-link" id="sidebar-nav-stats">
            <i class="fa-sharp-duotone fa-solid fa-chart-line"></i> Campaign Stats
          </a>
          <a href="config.html" class="nav-link" id="sidebar-nav-settings">
            <i class="fa-sharp-duotone fa-solid fa-gear"></i> Settings
          </a>
        </nav>
      </aside>

      <!-- Main Workspace -->
      <main class="main-content">
        <!-- Top Bar -->
        <div class="top-bar">
          <div class="page-header">
            <h1>My Lists</h1>
            <p>Voters who will vote for you and those to call later</p>
          </div>
          <div class="user-profile" id="user-profile-widget">
            <div class="user-avatar" id="user-avatar-initials">VT</div>
            <div class="user-info">
              <span class="user-name" id="display-candidate-name">Candidate</span>
              <span class="user-role">Election Candidate</span>
            </div>
          </div>
        </div>

        <!-- Summary Stats -->
        <div class="lists-summary">
          <div class="lists-summary-card summary-green">
            <div class="lists-summary-icon">
              <i class="fa-sharp-duotone fa-solid fa-circle-check"></i>
            </div>
            <div class="lists-summary-info">
              <span class="lists-summary-count" id="summary-vote-me-count">0</span>
              <span class="lists-summary-label">Will Vote Me</span>
            </div>
          </div>
          <div class="lists-summary-card summary-orange">
            <div class="lists-summary-icon">
              <i class="fa-sharp-duotone fa-solid fa-clock"></i>
            </div>
            <div class="lists-summary-info">
              <span class="lists-summary-count" id="summary-call-later-count">0</span>
              <span class="lists-summary-label">Call Later</span>
            </div>
          </div>
        </div>

        <!-- Voter Lists -->
        <div class="voter-list-columns">
          <!-- Will Vote Me List -->
          <div class="voter-list-panel">
            <div class="voter-list-panel-header panel-green">
              <h3><i class="fa-sharp-duotone fa-solid fa-circle-check"></i> Will Vote Me</h3>
              <span class="list-count-badge" id="list-count-vote-me">0</span>
            </div>
            <div class="voter-list-scroll" id="list-vote-me"></div>
          </div>

          <!-- Call Later List -->
          <div class="voter-list-panel">
            <div class="voter-list-panel-header panel-orange">
              <h3><i class="fa-sharp-duotone fa-solid fa-clock"></i> Call Later</h3>
              <span class="list-count-badge" id="list-count-call-later">0</span>
            </div>
            <div class="voter-list-scroll" id="list-call-later"></div>
          </div>
        </div>
      </main>

      <!-- Bottom Navigation Bar (Mobile) -->
      <nav class="mobile-nav" id="mobile-navigation-bar">
        <a href="index.html" class="mobile-nav-link" id="mobile-nav-dashboard">
          <i class="fa-sharp-duotone fa-solid fa-address-book"></i>
          <span>Voters</span>
        </a>
        <a href="lists.html" class="mobile-nav-link active" id="mobile-nav-lists">
          <i class="fa-sharp-duotone fa-solid fa-list-check"></i>
          <span>Lists</span>
        </a>
        <a href="stats.html" class="mobile-nav-link" id="mobile-nav-stats">
          <i class="fa-sharp-duotone fa-solid fa-chart-line"></i>
          <span>Stats</span>
        </a>
        <a href="config.html" class="mobile-nav-link" id="mobile-nav-settings">
          <i class="fa-sharp-duotone fa-solid fa-gear"></i>
          <span>Settings</span>
        </a>
      </nav>
    </div>

    <!-- Edit Voter Modal -->
    <div class="modal-overlay" id="edit-modal-overlay">
      <div class="modal" id="edit-modal">
        <div class="modal-header">
          <h3><i class="fa-sharp-duotone fa-solid fa-pen-to-square"></i> Edit Voter Details</h3>
          <button class="modal-close-btn" id="modal-close-btn">
            <i class="fa-sharp-duotone fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body">
          <div class="modal-voter-id" id="modal-voter-id">#0</div>
          <div class="form-group">
            <label for="edit-name">Name</label>
            <input type="text" class="form-input" id="edit-name" placeholder="Voter name" />
          </div>
          <div class="form-group">
            <label for="edit-title">Title</label>
            <input type="text" class="form-input" id="edit-title" placeholder="Title / Role" />
          </div>
          <div class="form-group">
            <label for="edit-phone">Phone</label>
            <input type="text" class="form-input" id="edit-phone" placeholder="Phone number" />
          </div>
          <div class="form-group">
            <label for="edit-address">Address</label>
            <input type="text" class="form-input" id="edit-address" placeholder="Address" />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
          <button class="btn btn-primary" id="modal-save-btn">
            <i class="fa-sharp-duotone fa-solid fa-check"></i> Save Changes
          </button>
        </div>
      </div>
    </div>

    <script src="js/lists.js"></script>
  </body>
</html>
